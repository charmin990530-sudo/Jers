<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf3ee">
    <meta name="description" content="By Jers - Inicia sesión en tu cuenta">
    <title>By Jers | Iniciar Sesión</title>
    <link rel="canonical" href="https://byjers.com/login.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- Estilos compartidos + estilos específicos de auth -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/loader-boot.js"></script>
    <script src="js/fondo-textura.js" defer></script>
</head>

<body class="auth-page login-page">

    <!-- ============================================
         HEADER COMPARTIDO
         Incluye logo, menú hamburguesa (móvil), navegación y carrito
         Se repite en todas las páginas para consistencia
         ============================================ -->
    <header class="header">
        <nav class="menu">
            <img src="img/logo/logo.webp" alt="Logo By Jers" class="menulogo" width="300" height="300">

            <button class="menu-toggle" aria-label="Abrir menú" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="menulist">
                <li class="menuitem"><a href="index.html">Inicio</a></li>
                <li class="menuitem"><a href="maquillaje.html">Maquillaje</a></li>
                <li class="menuitem"><a href="cabello.html">Cuidado capilar</a></li>
                <li class="menuitem"><a href="resenas.html">Reseñas</a></li>
                <li class="menuitem"><a href="contacto.html">Contacto</a></li>
            </ul>

            <button class="carrito-icono" aria-label="Abrir carrito" aria-expanded="false" aria-controls="carritoPanel" type="button">
                🛍️ <span class="carrito-contador">0</span>
            </button>
        </nav>
    </header>

    <main>
        <!-- ============================================
             SECCIÓN PRINCIPAL DEL FORMULARIO
             .auth-container: centra el formulario vertical y horizontalmente
             .auth-card: tarjeta blanca con sombra, padding generoso
             ============================================ -->
        <section class="auth-container">
            <div class="auth-card">

                <!-- Header del formulario con título y subtítulo -->
                <div class="auth-header">
                    <h1>Bienvenida de vuelta</h1>
                    <p>Inicia sesión para acceder a tu cuenta</p>
                </div>

                <!-- ============================================
                     FORMULARIO DE LOGIN
                     - novalidate: desactiva validación nativa del navegador
                       (usamos validación custom JS para mejor UX)
                     - Cada .campo agrupa label + input + mensaje error
                     ============================================ -->
                <form class="formulario-auth" id="formLogin" method="post" novalidate>

                    <!-- Campo Email -->
                    <div class="campo">
                        <label for="email">Correo electrónico</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="tu@email.com"
                            required>
                        <!-- Span para mostrar error de validación (vacío inicialmente) -->
                        <span class="campo-error" aria-live="polite"></span>
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="campo">
                        <div class="campo-label-row">
                            <label for="password">Contraseña</label>
                            <!-- Enlace "¿Olvidaste?" - luego crearemos reset-password.html -->
                            <a href="reset-password.html" class="enlace-olvido">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                placeholder="••••••••"
                                required>
                            <!-- Botón toggle mostrar/ocultar contraseña -->
                            <button type="button" class="password-toggle" aria-label="Mostrar contraseña">
                                <span class="ojo-abierto" aria-hidden="true">👁️</span>
                                <span class="ojo-cerrado" aria-hidden="true" hidden>🙈</span>
                            </button>
                        </div>
                        <span class="campo-error" aria-live="polite"></span>
                    </div>

                    <!-- Checkbox Recordarme (opcional - extendido: 30 días) -->
                    <div class="campo checkbox-campo">
                        <input type="checkbox" id="recordarme" name="recordarme">
                        <label for="recordarme">Recordarme por 30 días</label>
                    </div>

                    <!-- Mensaje general de error/éxito del formulario -->
                    <p class="formulario-mensaje" aria-live="assertive"></p>

                    <!-- Botón submit -->
                    <button type="submit" class="auth-btn" id="btnLogin">
                        <span class="btn-texto">Iniciar sesión</span>
                        <span class="btn-loader" hidden aria-hidden="true">⏳</span>
                    </button>
                </form>

                <!-- Footer: enlace a registro -->
                <p class="auth-footer">
                    ¿No tienes cuenta?
                    <a href="register.html">Regístrate gratis</a>
                </p>
            </div>
        </section>
    </main>

    <!-- ============================================
         CARRITO LATERAL (compartido)
         Se inyecta en todas las páginas; JS en app.js lo controla
         ============================================ -->
    <div class="carrito-panel" id="carritoPanel" role="dialog" aria-modal="true" aria-labelledby="carritoTitulo" aria-hidden="true" inert>
        <div class="carrito-cabecera">
            <h2 id="carritoTitulo">Tu carrito</h2>
            <button class="carrito-cerrar" aria-label="Cerrar carrito" type="button">✕</button>
        </div>
        <ul class="carrito-lista"></ul>
        <div class="carrito-resumen">
            <p>Total: <span class="carrito-total">$0</span></p>
            <button class="finalizar-pedido" type="button">Finalizar pedido</button>
        </div>
    </div>
    <div class="carrito-fondo"></div>

    <!-- Footer compartido -->
    <footer class="site-footer">
        <div class="redes-sociales">
            <a href="https://facebook.com/tu-tienda" aria-label="Facebook">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.988H7.898v-2.89h2.54V9.797c0-2.507 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.242 0-1.63.771-1.63 1.562v1.875h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" />
                </svg>
            </a>
            <a href="https://instagram.com/tu-tienda" aria-label="Instagram">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-2a1.5 1.5 0 11-3.001-.001A1.5 1.5 0 0116.5 7z" />
                </svg>
            </a>
            <a href="https://twitter.com/tu-tienda" aria-label="Twitter">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M22.46 6c-.77.35-1.6.58-2.46.69a4.28 4.28 0 001.88-2.37 8.59 8.59 0 01-2.72 1.04 4.27 4.27 0 00-7.27 3.89A12.12 12.12 0 013 4.79a4.27 4.27 0 001.32 5.7 4.24 4.24 0 01-1.94-.54v.05a4.27 4.27 0 003.43 4.18 4.3 4.3 0 01-1.93.07 4.27 4.27 0 003.99 2.97A8.57 8.57 0 012 19.54a12.09 12.09 0 006.56 1.92c7.88 0 12.2-6.53 12.2-12.2 0-.19-.01-.39-.02-.58A8.72 8.72 0 0022.46 6z" />
                </svg>
            </a>
        </div>
        <p>© 2026 Jers.</p>
    </footer>

    <!-- Script principal de la página (módulo ES6) -->
    <script type="module" src="js/login.js"></script>
</body>

</html>
