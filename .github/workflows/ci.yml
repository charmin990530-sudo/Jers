name: CI

on:
  push:
    # Se corre en cualquier rama de trabajo, no solo en main/master. Con el
    # filtro de antes, un `fix/**` o un `chore/**` no daba ninguna señal hasta
    # que alguien abria la PR: los tests solo saltaban en el push a la rama
    # principal, que es justo cuando ya no hay nada que arreglar.
    branches:
      - main
      - master
      - 'fix/**'
      - 'chore/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master
      - 'fix/**'
      - 'chore/**'
      - 'feat/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # B-06. El linter y el type-check van ANTES que los tests: son mas rapidos
      # y si algo esta mal tipado conviene enterarse antes de esperar 90 s.
      #
      # El type-check no cubre todo `js/`, y no por descuido: activarlo en los
      # controladores de pagina daria cientos de errores de estrechamiento DOM
      # que no son bugs. El alcance y el motivo estan en jsconfig.json.
      - name: Lint
        run: npm run lint

      - name: Type-check frontend (checkJs)
        run: npm run typecheck

      # `npm test` corre las dos suites: `test:backend` (13 suites, 199 tests) y
      # `test:frontend` (js/api.js, 20 tests). Los tests del backend necesitan
      # JWT_SECRET; los del frontend no leen variables de entorno, asi que van con
      # las mismas y no estorban.
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-not-for-production-use-1234567890

      # El runner de GitHub Actions corre en UTC, que es tambien la zona de
      # Vercel, asi que esta pasada ya cubre el caso real de produccion.
      #
      # La segunda pasada fija TZ=America/Bogota a proposito. El bug del "ingreso
      # del dia" (adminController) solo se manifestaba cuando la zona del
      # PROCESO era distinta de la del negocio: en un runner en hora Colombia el
      # codigo erroneo y el correcto dan el mismo resultado, y el test pasaba sin
      # detectar nada. Cubrir las dos zonas hace que esa clase de error no vuelva
      # a pasar desapercibida.
      - name: Run tests in Colombia timezone
        run: npm test
        env:
          NODE_ENV: test
          TZ: America/Bogota
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-not-for-production-use-1234567890

      # M-12/B-07. Antes eran dos comandos:
      #
      #   npm audit --audit-level=high
      #   npm audit --audit-level=high --prefix backend
      #
      # El segundo no puede funcionar. `backend` es un workspace, no un proyecto
      # con dependencias propias: npm no escribe lockfile en un workspace member
      # y lo sube todo a la raiz. `npm audit --prefix backend` busca
      # `backend/package-lock.json`, no lo encuentra y muere con ENOLOCK, asi que
      # este paso del pipeline estaba rojo siempre que llegaba aqui.
      #
      # El comando de la raiz ya cubre el backend entero: el lockfile raiz tiene
      # la entrada `backend` con sus 16 dependencias (13 + 3 de desarrollo) y
      # todas están resueltas en el árbol raiz, que es justo lo que `npm audit`
      # recorre. Comprobado sobre package-lock.json (lockfileVersion 3).
      #
      # La forma de auditar backend por separado seria darle lockfile propio
      # (`npm i --package-lock-only --prefix backend`), lo que crea un segundo
      # origen de verdad que se desincroniza del primero. No compensa.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build static files
        run: npm run build:static
        env:
          NODE_ENV: production
          JWT_SECRET: build-secret-for-static-generation-only
          MONGODB_URI: mongodb+srv://placeholder:placeholder@cluster.mongodb.net/placeholder
          REDIS_URL: rediss://placeholder:placeholder@placeholder.upstash.io:6379
          REDIS_ENABLED: false
          COOKIE_SECURE: true
          TRUST_PROXY_HOPS: 1
          SECRETS_FROM_ENV: true
          SMTP_HOST: smtp.placeholder.com
          SMTP_USER: placeholder
          SMTP_PASS: placeholder
          FRONTEND_URL: https://placeholder.vercel.app
          FRONTEND_ALLOWED_ORIGINS: https://placeholder.vercel.app
          API_ORIGIN: https://placeholder.vercel.app
          HOST: 0.0.0.0
