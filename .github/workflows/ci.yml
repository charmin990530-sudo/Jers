name: CI

on:
  push:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/angular/package-lock.json

      - name: Check repository secrets
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/jers-gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/jers-gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/jers-gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts=--all

      - name: Install dependencies
        run: npm ci --include=dev --no-audit && npm ci --include=dev --no-audit --prefix frontend/angular

      - name: Lint and type-check
        run: npm run check

      - name: Run backend and Angular tests
        run: npm test
        env:
          NODE_ENV: test
          TZ: UTC
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-not-for-production-use-1234567890

      # El balance diario también debe funcionar con el proceso en hora Colombia.
      - name: Run backend tests in Colombia timezone
        run: npm run test:backend
        env:
          NODE_ENV: test
          TZ: America/Bogota
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-not-for-production-use-1234567890

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low && npm audit --omit=dev --audit-level=low --prefix frontend/angular

      - name: Build static files
        run: npm run build:static
