<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="By Jers - Contáctanos para asesoría personalizada.">
    <title>By Jers | Contacto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- Estilos compartidos y estilos exclusivos de Contacto. -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>

<body class="contacto-page">

    <header class="header">
        <nav class="menu">
            <img src="img/logo/logo.png" alt="Logo By Jers" class="menulogo">

            <button class="menu-toggle" aria-label="Abrir menú" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="menulist">
                <li class="menuitem"><a href="index.html" target="_blank" rel="noopener">Inicio</a></li>
                <li class="menuitem"><a href="maquillaje.html" target="_blank" rel="noopener">Maquillaje</a></li>
                <li class="menuitem"><a href="cabello.html" target="_blank" rel="noopener">Cuidado capilar</a></li>
                <li class="menuitem"><a href="resenas.html" target="_blank" rel="noopener">Reseñas</a></li>
                <li class="menuitem"><a href="contacto.html" target="_blank" rel="noopener">Contacto</a></li>
            </ul>

            <button class="carrito-icono" aria-label="Abrir carrito" type="button">
                🛍️ <span class="carrito-contador">0</span>
            </button>
        </nav>
    </header>

    <main>

        <section class="pagina-header">
            <h1>Contáctanos</h1>
            <p>¿Tienes dudas sobre un producto o tu tono ideal? Escríbenos.</p>
        </section>

        <section class="contact">
            <p class="contact-subtitulo">Déjanos tus datos y te contactaremos pronto.</p>

            <form class="formulario-contacto" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Tu número de contacto">
                </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com">
                </div>

                <button class="contact-btn" type="submit">Enviar</button>

                <p class="formulario-mensaje"></p>
            </form>
        </section>

    </main>

    <div class="carrito-panel">
        <div class="carrito-cabecera">
            <h2>Tu carrito</h2>
            <button class="carrito-cerrar" aria-label="Cerrar carrito" type="button">✕</button>
        </div>

        <ul class="carrito-lista"></ul>

        <div class="carrito-resumen">
            <p>Total: <span class="carrito-total">$0</span></p>
            <button class="finalizar-pedido" type="button">Finalizar pedido por WhatsApp</button>
        </div>
    </div>
    <div class="carrito-fondo"></div>

    <footer style="background:#222; color:#fff; padding:20px; text-align:center;">
        <div style="margin-bottom:10px;">
            <a href="https://facebook.com/tu-tienda" style="margin:0 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24">
                    <path
                        d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.988H7.898v-2.89h2.54V9.797c0-2.507 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.242 0-1.63.771-1.63 1.562v1.875h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" />
                </svg>
            </a>
            <a href="https://instagram.com/tu-tienda" style="margin:0 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24">
                    <path
                        d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-2a1.5 1.5 0 11-3.001-.001A1.5 1.5 0 0116.5 7z" />
                </svg>
            </a>
            <a href="https://twitter.com/tu-tienda" style="margin:0 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24">
                    <path
                        d="M22.46 6c-.77.35-1.6.58-2.46.69a4.28 4.28 0 001.88-2.37 8.59 8.59 0 01-2.72 1.04 4.27 4.27 0 00-7.27 3.89A12.12 12.12 0 013 4.79a4.27 4.27 0 001.32 5.7 4.24 4.24 0 01-1.94-.54v.05a4.27 4.27 0 003.43 4.18 4.3 4.3 0 01-1.93.07 4.27 4.27 0 003.99 2.97A8.57 8.57 0 012 19.54a12.09 12.09 0 006.56 1.92c7.88 0 12.2-6.53 12.2-12.2 0-.19-.01-.39-.02-.58A8.72 8.72 0 0022.46 6z" />
                </svg>
            </a>
        </div>
        <p>© 2026 Jers.</p>
    </footer>

    <!-- contacto.js añade la validación del formulario a app.js. -->
    <script type="module" src="js/contacto.js"></script>
</body>

</html>
