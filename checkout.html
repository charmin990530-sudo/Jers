<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar pedido | By Jers</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Ir al inicio">By Jers</a>
    </header>

    <main class="checkout-page">
        <h1>Finalizar pedido</h1>
        <p>Revisa tu pedido y completa los datos de entrega.</p>

        <section class="checkout-summary" aria-labelledby="resumen-title">
            <h2 id="resumen-title">Resumen</h2>
            <ul id="checkout-items"></ul>
            <p class="checkout-total">Total: <strong id="checkout-total">$0</strong></p>
        </section>

        <form id="checkout-form" class="formulario-auth" method="post" novalidate>
            <h2>Datos de envío</h2>
            <div class="campo">
                <label for="saved-address">Dirección guardada</label>
                <select id="saved-address" name="savedAddress">
                    <option value="">Nueva dirección</option>
                </select>
            </div>
            <div class="campo">
                <label for="alias">Alias</label>
                <input id="alias" name="alias" required minlength="2" maxlength="30">
            </div>
            <div class="campo">
                <label for="nombre-completo">Nombre completo</label>
                <input id="nombre-completo" name="nombreCompleto" required minlength="2" maxlength="100">
            </div>
            <div class="campo">
                <label for="telefono-envio">Teléfono</label>
                <input id="telefono-envio" name="telefono" required inputmode="tel">
            </div>
            <div class="campo">
                <label for="direccion">Dirección</label>
                <input id="direccion" name="direccion" required minlength="5" maxlength="200">
            </div>
            <div class="campo">
                <label for="ciudad">Ciudad</label>
                <input id="ciudad" name="ciudad" required minlength="2" maxlength="50">
            </div>
            <div class="campo">
                <label for="departamento">Departamento</label>
                <input id="departamento" name="departamento" required minlength="2" maxlength="50">
            </div>
            <div class="campo">
                <label for="codigo-postal">Código postal</label>
                <input id="codigo-postal" name="codigoPostal" maxlength="10">
            </div>
            <div class="campo">
                <label for="notas">Notas</label>
                <textarea id="notas" name="notas" rows="4" maxlength="500"></textarea>
            </div>
            <p id="checkout-message" class="formulario-mensaje" aria-live="assertive"></p>
            <button id="checkout-submit" class="auth-btn" type="submit">
                <span class="btn-texto">Crear pedido</span>
                <span class="btn-loader" hidden>⏳</span>
            </button>
            <a id="whatsapp-link" class="auth-btn" href="#" target="_blank" rel="noopener" hidden>Confirmar por WhatsApp</a>
        </form>
    </main>

    <script type="module" src="js/checkout.js"></script>
</body>
</html>
