<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a3535" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#4a3535">
    <meta name="description" content="By Jers | Una experiencia visual antes de descubrir la tienda.">
    <title>By Jers | Bienvenida</title>
    <link rel="canonical" href="https://byjers.com/bienvenida.html">

    <meta property="og:type" content="website">
    <meta property="og:title" content="By Jers | Bienvenida">
    <meta property="og:url" content="https://byjers.com/bienvenida.html">
    <meta property="og:site_name" content="By Jers">
    <meta property="og:image" content="https://byjers.com/img/hero/soficora.webp">
    <meta property="og:locale" content="es_CO">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/bienvenida.css">
    <script src="js/loader-boot.js"></script>
    <script src="js/fondo-textura.js" defer></script>
</head>

<body class="bienvenida-page">

    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <main class="bienvenida" id="contenido">
        <div class="intro-loader" id="intro-loader" role="status" aria-live="polite" aria-busy="true">
            <div class="catalogo-loading intro-loader-content">
                <div class="spinner" aria-hidden="true"></div>
                <p class="intro-loader-label">Preparando la experiencia</p>
                <p class="intro-loader-progress" id="loader-progress">0%</p>
                <div class="intro-progress-track" aria-hidden="true">
                    <span class="intro-progress-bar" id="loader-bar"></span>
                </div>
            </div>
        </div>

        <section class="intro-scroll" id="intro-scroll" aria-label="Presentacion del producto destacado">
            <div class="intro-pin" id="intro-pin">
                <canvas class="intro-canvas" id="hero-canvas" aria-hidden="true"></canvas>
                <div class="intro-shade" aria-hidden="true"></div>

                <div class="intro-topline">
                    <span>By Jers</span>
                    <span>Edición tendencia</span>
                </div>

                <div class="intro-copy" id="intro-copy">
                    <p class="intro-eyebrow" id="product-eyebrow">La nueva protagonista</p>
                    <h1 class="intro-title" id="product-name">By Jers</h1>
                    <div class="intro-price-row">
                        <span class="intro-price" id="product-price"></span>
                        <del class="intro-previous-price" id="product-previous-price" hidden></del>
                        <span class="intro-discount" id="discount-badge" hidden></span>
                    </div>
                    <p class="intro-fallback-notice" id="fallback-notice" role="status" hidden>Vista previa disponible</p>
                    <a class="intro-cta" id="store-link" href="index.html">
                        <span>Entrar a la tienda</span>
                        <span class="intro-cta-arrow" aria-hidden="true">↗</span>
                    </a>
                </div>

                <div class="intro-scroll-hint" id="scroll-hint" aria-hidden="true">
                    <span>Desliza para descubrirlo</span>
                    <span class="intro-scroll-line"></span>
                </div>
            </div>
        </section>
    </main>

    <noscript>
        <div class="intro-noscript">
            <p>La experiencia visual necesita JavaScript.</p>
            <a href="index.html">Entrar a la tienda</a>
        </div>
    </noscript>

    <!--
      GSAP va con Subresource Integrity. La CSP de vercel.json ya limita
      script-src a 'self' y a cdn.jsdelivr.net, pero eso solo dice de donde
      puede venir el script: no impide que quien controle la respuesta del CDN
      ejecute codigo en la pagina. El hash es lo que ata el archivo a esta
      version concreta (3.15.0, fijada en la URL): si el CDN sirve otra cosa,
      el navegador la rechaza en vez de ejecutarla.

      crossorigin="anonymous" es obligatorio: sin el, el navegador hace la
      peticion sin credenciales y el hash no coincide nunca.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"
            integrity="sha384-XmJ9SoHtVOHoQUcKvFAzVXwdkKo1Ie3bhmSoIAkcdsHGaIrVJIkmozyq0FJeb/Ly"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"
            integrity="sha384-wl5TeDVvOWt30Pbf8aSo2ZrzsOjddu3avOBvHe+p+OhJt9gP6w9YXmDkN5DK2/dF"
            crossorigin="anonymous"></script>
    <script type="module" src="js/bienvenida.js"></script>
</body>

</html>
