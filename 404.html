<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — By Jers</title>
    <meta name="description" content="La página que buscas no existe o cambió de dirección.">
    <link rel="icon" href="/img/logo/logo.webp" type="image/webp">
    <link rel="stylesheet" href="/css/base.css">
    <style>
        .e404 {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: var(--spacing-xl) var(--spacing-md);
            text-align: center;
        }

        .e404__caja {
            max-width: 34rem;
        }

        .e404__codigo {
            font-family: var(--fuente-titulos);
            font-size: clamp(4rem, 18vw, 8rem);
            line-height: 1;
            color: var(--color-mauve);
            margin: 0;
        }

        .e404__titulo {
            font-family: var(--fuente-titulos);
            font-size: clamp(1.4rem, 5vw, 2rem);
            color: var(--color-texto);
            margin: var(--spacing-sm) 0 var(--spacing-md);
        }

        .e404__texto {
            color: var(--color-gray-medium);
            margin: 0 0 var(--spacing-lg);
        }

        .e404__acciones {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            justify-content: center;
        }

        .e404__enlace {
            display: inline-block;
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-full);
            text-decoration: none;
            font-weight: 500;
            transition: transform var(--transition-fast), background var(--transition-fast);
        }

        .e404__enlace:hover,
        .e404__enlace:focus-visible {
            transform: translateY(-2px);
        }

        .e404__enlace--primario {
            background: var(--color-mauve);
            color: var(--color-blanco);
        }

        .e404__enlace--secundario {
            background: var(--color-blanco);
            color: var(--color-texto);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <main class="e404">
        <div class="e404__caja">
            <p class="e404__codigo">404</p>
            <h1 class="e404__titulo">No encontramos esta página</h1>
            <p class="e404__texto">
                Puede que el enlace esté equivocado o que el producto ya no esté disponible.
                Te dejamos de vuelta donde empezó todo.
            </p>
            <div class="e404__acciones">
                <a class="e404__enlace e404__enlace--primario" href="/">Ir al inicio</a>
                <a class="e404__enlace e404__enlace--secundario" href="/maquillaje">Ver maquillaje</a>
                <a class="e404__enlace e404__enlace--secundario" href="/cabello">Ver cuidado capilar</a>
            </div>
        </div>
    </main>
</body>
</html>
