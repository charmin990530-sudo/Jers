<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf3ee">
    <meta name="description" content="By Jers - Detalle del producto">
    <title>By Jers | Producto</title>
    <link rel="canonical" href="https://byjers.com/producto.html">

    <meta property="og:type" content="product">
    <meta property="og:title" content="By Jers | Producto">
    <meta property="og:description" content="Detalle de producto By Jers">
    <meta property="og:image" content="/img/logo/logo.webp">
    <meta property="og:locale" content="es_CO">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/producto.css">
    <!--
      NO se declara aquí un JSON-LD `Product` estático. Antes lo había, con
      `name: "By Jers Producto"` (idéntico en todas las fichas), SIN
      `offers.price` y con `availability: InStock` siempre. Eso es structured
      data engañoso: `Offer` sin `price` es inválido para los rich results de
      producto, y declarar disponible un producto agotado expone a una acción
      manual de Google.

      Ahora lo genera `js/producto.js` a partir del producto real, una vez la API
      responde, en actualizarDatosEstructurados(). Si el producto está agotado se
      marca OutOfStock, y si no hay datos no se emite nada en vez de emitir datos
      falsos.
    -->
    <script src="js/loader-boot.js"></script>
    <script src="js/fondo-textura.js" defer></script>
</head>

<body class="producto-page">

    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <header class="header">
        <nav class="menu">
            <img src="img/logo/logo.webp" alt="Logo By Jers" class="menulogo" width="300" height="300">

            <button class="menu-toggle" aria-label="Abrir menú" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="menulist">
                <li class="menuitem"><a href="index.html">Inicio</a></li>
                <li class="menuitem"><a href="maquillaje.html">Maquillaje</a></li>
                <li class="menuitem"><a href="cabello.html">Cuidado capilar</a></li>
                <li class="menuitem"><a href="resenas.html">Reseñas</a></li>
                <li class="menuitem"><a href="contacto.html">Contacto</a></li>
            </ul>

            <button class="carrito-icono" aria-label="Abrir carrito" aria-expanded="false" aria-controls="carritoPanel" type="button">
                🛍️ <span class="carrito-contador">0</span>
            </button>
        </nav>
    </header>

    <main id="contenido">
        <!-- Breadcrumb -->
        <nav class="breadcrumb container" aria-label="Ruta de navegación">
            <ol class="breadcrumb-lista">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#" id="breadcrumbCategoria">Categoría</a></li>
                <li aria-current="page" id="breadcrumbProducto">Producto</li>
            </ol>
        </nav>

        <!-- Producto Principal -->
        <section class="producto-detalle container">
            <div class="producto-grid" id="productoContenido">
                <!--
                  El h1 de la ficha lo inyecta js/producto.js cuando la API
                  responde, con el nombre real del producto. Ese h1 no existia
                  en el HTML: sin JavaScript, o con un fallo de red antes de
                  pintar, la pagina se quedaba sin ningun encabezado de nivel 1
                  y los lectores de pantalla no tenían ningun título que leer.

                  Este h1 de reserva vive dentro del MIS contenedor que el JS
                  vacía con innerHTML, así que nunca coexiste con el suyo: en
                  cuanto corre el script desaparece. `.producto-titulo-reserva`
                  hace que ocupe la fila completa del grid mientras está solo.
                -->
                <h1 class="producto-nombre producto-titulo-reserva">Cargando producto...</h1>
            </div>
        </section>

        <!-- Productos Relacionados -->
        <section class="container revelar" id="seccionRelacionados" hidden>
            <h2 class="titulo-seccion">También te puede interesar</h2>
            <div class="tarjetas" id="relacionadosGrid">
                <!-- Se llena dinámicamente -->
            </div>
        </section>
    </main>

    <div class="carrito-panel" id="carritoPanel" role="dialog" aria-modal="true" aria-labelledby="carritoTitulo" aria-hidden="true" inert>
        <div class="carrito-cabecera">
            <h2 id="carritoTitulo">Tu carrito</h2>
            <button class="carrito-cerrar" aria-label="Cerrar carrito" type="button">✕</button>
        </div>

        <ul class="carrito-lista"></ul>

        <div class="carrito-resumen">
            <p>Total: <span class="carrito-total">$0</span></p>
            <button class="finalizar-pedido" type="button">Finalizar pedido</button>
        </div>
    </div>
    <div class="carrito-fondo"></div>

    <footer class="site-footer">
        <div class="redes-sociales">
            <a href="https://facebook.com/tu-tienda" aria-label="Facebook">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                        d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.988H7.898v-2.89h2.54V9.797c0-2.507 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.242 0-1.63.771-1.63 1.562v1.875h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" />
                </svg>
            </a>
            <a href="https://instagram.com/tu-tienda" aria-label="Instagram">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                        d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-2a1.5 1.5 0 11-3.001-.001A1.5 1.5 0 0116.5 7z" />
                </svg>
            </a>
            <a href="https://twitter.com/tu-tienda" aria-label="Twitter">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                        d="M22.46 6c-.77.35-1.6.58-2.46.69a4.28 4.28 0 001.88-2.37 8.59 8.59 0 01-2.72 1.04 4.27 4.27 0 00-7.27 3.89A12.12 12.12 0 013 4.79a4.27 4.27 0 001.32 5.7 4.24 4.24 0 01-1.94-.54v.05a4.27 4.27 0 003.43 4.18 4.3 4.3 0 01-1.93.07 4.27 4.27 0 003.99 2.97A8.57 8.57 0 012 19.54a12.09 12.09 0 006.56 1.92c7.88 0 12.2-6.53 12.2-12.2 0-.19-.01-.39-.02-.58A8.72 8.72 0 0022.46 6z" />
                </svg>
            </a>
        </div>
        <p>© 2026 Jers.</p>
    </footer>

    <script type="module" src="js/producto.js"></script>
</body>

</html>
